# Copiar para secrets.yaml (ignorado pelo git) e preencher.
wifi_ssid: "NOME_DA_REDE"
wifi_password: "SENHA_DA_REDE"
# Segunda rede (bancada/lab).
wifi_ssid_lab: "NOME_DA_REDE_LAB"
wifi_password_lab: "SENHA_DA_REDE_LAB"
# Terceira rede (turbina).
wifi_ssid_turbina: "NOME_DA_REDE_TURBINA"
wifi_password_turbina: "SENHA_DA_REDE_TURBINA"

# Senha do AP de emergência (mín. 8 caracteres).
ap_password: "TROCAR_AP_8+"

# Chave da API nativa (32 bytes em base64). Gerar com:
#   openssl rand -base64 32
api_encryption_key: "COLAR_SAIDA_DO_OPENSSL"

# Senha de OTA. Gerar com:
#   openssl rand -hex 16
ota_password: "TROCAR_OTA"
